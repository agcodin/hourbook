<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hourbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Field Notebook: graph paper, ballpoint ink, highlighter marks. Deliberately a single light, paper look. */
:root{
  color-scheme:light;
  --paper:#F7F9FC; --grid:#DCE6F2; --card:#FFFFFF; --card-soft:#FBFCFE;
  --ink:#1F3A93; --text:#26324A; --muted:#66758F; --faint:#98A5BB; --label:#7384A3;
  --line:#C6D3E6; --dash:#D2DCE9; --rule:#E7EEF7;
  --hl:#FFE45C; --hl-soft:#FFF1A1; --note:#FFF3A3; --note-ink:#3B3A2A; --tape:rgba(140,195,240,.6); --pink:#D9468C;
  --ok:#2A8F5E; --warn:#B7791F; --danger:#C2334D;
  --hand:"Kalam","Bradley Hand","Segoe Print",cursive;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:24px;padding-block:20px 56px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:32px;height:32px;border:2.5px solid var(--ink);border-radius:52% 46% 54% 48%;position:relative;transform:rotate(-6deg);flex:none}
.logo::before,.logo::after{content:"";position:absolute;left:50%;top:50%;width:2.5px;background:var(--ink);border-radius:2px;transform-origin:50% 100%}
.logo::before{height:10px;margin:-10px 0 0 -1.25px}
.logo::after{height:7px;margin:-7px 0 0 -1.25px;transform:rotate(100deg)}
.brand h1{font-family:var(--hand);font-weight:700;font-size:32px;color:var(--ink);margin:0;line-height:1}
.brand .tagline{font-family:var(--hand);color:var(--muted);font-size:17px;margin-top:6px}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--hl-soft);color:var(--text)}
.btn{border:1.5px solid var(--line);background:var(--card);padding:7px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{font-family:var(--hand);font-weight:700;font-size:19px;line-height:1.2;padding:5px 16px;border:2.5px solid var(--ink);color:var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--ink);border-radius:11px 15px 10px 14px;transform:rotate(-1.2deg);transition:transform .12s,box-shadow .12s}
.btn.primary:hover{transform:rotate(-1.2deg) translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn.primary:active{transform:rotate(-1.2deg) translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:rgba(255,255,255,.75)}
.btn.danger{color:var(--danger)}
.account{display:flex;align-items:center;gap:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--hand);font-size:16px;line-height:1.25;color:var(--muted);border:2px solid currentColor;border-radius:8px 12px 7px 10px;padding:1px 9px;transform:rotate(-2deg);max-width:280px;background:rgba(255,255,255,.7)}
.sync i{display:none}
.sync[data-state="synced"]{color:var(--ok)}
.sync[data-state="saving"]{color:var(--warn)}
.sync[data-state="error"]{color:var(--danger)}
.sync span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Calendar */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;align-items:start}
.monthbar{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.monthbar h2{margin:0 auto 0 0;font-weight:400;line-height:1}
.monthbar h2 small{display:block;font-family:var(--hand);font-size:17px;color:var(--muted);margin-bottom:2px}
.hl{font-family:var(--hand);font-weight:700;color:var(--ink);background:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 88%,transparent 88%);padding:0 4px}
.monthbar h2 .hl{font-size:46px}
.monthbar .meta{font-family:var(--hand);font-size:18px;color:var(--muted);margin-right:8px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;line-height:1;font-weight:700}
.iconbtn:hover{border-color:var(--ink)}
.monthbar .btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--text);height:38px}
.monthbar .btn.ghost:hover{border-color:var(--ink)}
.grid{background:rgba(255,255,255,.82);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:6px 10px;font-family:var(--hand);font-size:16px;color:var(--label);border-bottom:1.5px solid var(--line)}
.day{min-height:116px;border:0;border-right:1.5px dashed var(--dash);border-bottom:1.5px dashed var(--dash);background:transparent;text-align:left;padding:6px 7px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day:nth-child(7n){border-right:0}
.day:nth-last-child(-n+7){border-bottom:0}
.day.out .dnum,.day.out .chips{opacity:.38}
.day:hover{background:rgba(255,241,161,.35)}
.day.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
.dnum{font-family:var(--hand);font-size:17px;color:#4A5A78;width:30px;height:30px;display:grid;place-items:center;flex:none}
.day.today .dnum{border:2.5px solid var(--pink);border-radius:52% 45% 55% 48%;transform:rotate(-8deg);color:var(--pink);font-weight:700}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--hand);font-size:15px;line-height:1.25;padding:0 6px;background:color-mix(in srgb,var(--c) 30%,transparent);border-radius:2px 8px 3px 7px;transform:rotate(-.8deg)}
.chip i{display:none}
.chip b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;color:var(--text)}
.chip em{font-style:normal;font-size:13px;color:#4A5A78;flex:none}
.more{font-family:var(--hand);font-size:14px;color:var(--muted);padding-left:6px}

/* Side column: sticky note, day page, month totals */
.side{display:flex;flex-direction:column;gap:20px;position:sticky;top:16px}
.sticky{background:var(--note);color:var(--note-ink);padding:22px 20px 16px;transform:rotate(1.4deg);box-shadow:0 10px 22px rgba(40,50,80,.15);position:relative;margin-top:8px}
.sticky::before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:24px;margin-left:-48px;background:var(--tape);transform:rotate(-4deg)}
.sticky b{display:block;font-family:var(--hand);font-weight:700;font-size:24px;line-height:1.1;margin-bottom:4px}
.sticky p{margin:0;font-family:var(--hand);font-size:17px;line-height:1.4}
.panel{background-color:var(--card);background-image:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px);background-position:0 12px;border:2px solid var(--line);border-radius:16px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-family:var(--hand);font-weight:700;font-size:25px;color:var(--ink);margin:0;line-height:1.15;text-wrap:balance}
.panel .sub{font-family:var(--hand);color:var(--muted);font-size:16px;margin-top:-8px}
.panel .btn.primary{align-self:flex-start;margin-top:4px}
.elist{display:flex;flex-direction:column;gap:4px}
.entry{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;border:0;border-radius:8px;padding:6px 6px 6px 2px;background:transparent;text-align:left;width:100%}
.entry:hover{background:rgba(255,241,161,.55)}
.entry .bar{align-self:stretch;min-height:34px;background:var(--c);opacity:.8;border-radius:3px;transform:skewY(-6deg)}
.entry .t{font-weight:600}
.entry .s{color:var(--muted);font-size:13px}
.entry .v{text-align:right;font-size:13px;color:var(--muted);display:flex;flex-direction:column}
.entry .v strong{font-family:var(--hand);font-size:19px;color:var(--ink);font-weight:700;line-height:1.1}
.empty{font-family:var(--hand);color:var(--muted);font-size:17px;padding:8px 2px}
.mt-rows{display:flex;flex-direction:column;gap:10px}
.mt-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;column-gap:10px;row-gap:3px}
.mt-dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
.mt-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-metric{font-size:13px;color:var(--muted)}
.mt-time{font-family:var(--hand);font-weight:700;font-size:18px;color:var(--ink)}
.mt-bar{grid-column:1/-1;height:8px}
.mt-bar i,.timecell .fill{display:block;height:100%;background:var(--c);border-radius:6px;opacity:.7;transform:skewX(-14deg)}

/* Totals */
.tot-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.tot-head h2{margin:0;font-size:40px;line-height:1.1;display:inline}
.tot-head .range{font-family:var(--hand);color:var(--muted);font-size:17px;margin-top:4px}
.tot-head .seg{margin-left:auto}
.summary{display:flex;gap:14px;flex-wrap:wrap}
.summary div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 18px;display:flex;flex-direction:column;min-width:130px}
.summary span{font-family:var(--hand);font-size:16px;color:var(--muted)}
.summary strong{font-family:var(--hand);font-weight:700;font-size:30px;color:var(--ink);line-height:1.1}
.table{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(150px,1.3fr) 80px minmax(160px,2fr) minmax(140px,1fr) 28px;gap:16px;align-items:center;padding:12px 18px;border-bottom:1.5px dashed var(--dash)}
.trow.th{font-family:var(--hand);font-size:16px;color:var(--label);padding-block:8px;border-bottom:1.5px solid var(--line)}
.trow.cat{width:100%;border:0;border-bottom:1.5px dashed var(--dash);background:transparent;text-align:left}
.trow.cat:hover{background:rgba(255,241,161,.35)}
.cname{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.cname i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.cname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess{font-family:var(--hand);font-size:18px}
.timecell{display:flex;align-items:center;gap:12px}
.timecell .track{flex:1;height:10px}
.timecell .num{min-width:70px;text-align:right;font-family:var(--hand);font-weight:700;font-size:18px;color:var(--ink)}
.metric .num{font-weight:600}
.metric small{display:block;color:var(--muted);font-size:12.5px}
.chev{color:var(--faint);font-size:20px;transition:transform .15s}
.open .chev{transform:rotate(90deg)}
.detail{background:var(--card-soft);border-bottom:1.5px dashed var(--dash);padding:4px 18px 10px}
.drow{display:grid;grid-template-columns:130px 90px 1fr 180px 60px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--dash);font-size:14px}
.drow:last-child{border-bottom:0}
.drow .note{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metricedit{display:flex;align-items:center;gap:6px}
.metricedit input{width:84px;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);text-align:right;font-variant-numeric:tabular-nums}
.metricedit label{color:var(--muted);font-size:12.5px}
.table .empty{padding:18px}

/* Dialogs */
dialog{border:2px solid var(--line);border-radius:16px;padding:0;background:var(--card);color:var(--text);box-shadow:0 18px 50px rgba(31,58,147,.2);width:min(470px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(38,50,74,.35)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.dlg h3{font-family:var(--hand);font-weight:700;font-size:28px;color:var(--ink);margin:0;line-height:1.1}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card-soft);width:100%}
.field input:focus,.field select:focus,.field textarea:focus,.catrow input:focus,.metricedit input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--hl-soft)}
.field textarea{resize:vertical;min-height:60px}
.hint{font-size:13px;color:var(--muted)}
#f-duration{font-family:var(--hand);font-size:17px;color:var(--ink)}
.actions{display:flex;gap:8px;align-items:center}
.actions .spacer{flex:1}
.catrows{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:2px}
.catrow{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--card-soft)}
.catrow .swatches{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:0;background:var(--c);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.catrow input{border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card);width:100%;min-width:0}
.catrow .dot{width:14px;height:14px;border-radius:50%;background:var(--c);align-self:center}
.catrow .mrow{grid-column:1/-1;display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center}

@media (max-width:1240px){
  .chip em{display:none}
}
@media (max-width:1000px){
  .cal-layout{grid-template-columns:1fr}
  .side{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
}
@media (max-width:700px){
  body{padding-inline:16px}
  .brand .tagline{display:none}
  .monthbar h2 .hl{font-size:36px}
  .day{min-height:66px;padding:4px}
  .dnum{width:24px;height:24px;font-size:15px}
  .chips{flex-direction:row;flex-wrap:wrap;gap:3px}
  .chip{width:9px;height:9px;padding:0;border-radius:50%;background:var(--c);transform:none}
  .chip b,.chip em,.more{display:none}
  .trow{grid-template-columns:1fr auto 20px;gap:4px 12px}
  .trow.th,.trow .sess{display:none}
  .trow .timecell{grid-column:1/-1;grid-row:2}
  .trow .metric{grid-column:2;grid-row:1;text-align:right}
  .trow .chev{grid-column:3;grid-row:1}
  .drow{grid-template-columns:1fr auto;gap:4px 10px}
  .drow .note{grid-column:1/-1}
  .fields{grid-template-columns:1fr}
  .sync{max-width:170px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo" aria-hidden="true"></span><h1>Hourbook</h1><span class="tagline">where your hours went</span></div>
    <div class="seg" role="group" aria-label="View">
      <button id="v-cal" aria-pressed="true">Calendar</button>
      <button id="v-tot" aria-pressed="false">Totals</button>
    </div>
    <button class="btn" id="open-cats">Categories</button>
    <button class="btn primary" id="log-btn">+ Log time</button>
    <div class="account" id="account" hidden>
      <span class="sync" id="sync" data-state="idle" role="status" hidden><i></i><span id="sync-label"></span></span>
      <button class="btn" id="signin-btn">Sign in to sync</button>
      <button class="btn ghost" id="signout-btn" hidden>Sign out</button>
    </div>
  </header>


  <section id="cal-view">
    <div class="cal-layout">
      <div>
        <div class="monthbar">
          <h2 id="month-title"></h2>
          <button class="iconbtn" id="prev-m" aria-label="Previous month">‹</button>
          <button class="iconbtn" id="next-m" aria-label="Next month">›</button>
          <button class="btn ghost" id="today-btn">Today</button>
          <span class="meta num" id="month-meta"></span>
        </div>
        <div class="grid">
          <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
          <div class="days" id="days"></div>
        </div>
      </div>
      <aside class="side">
        <div class="sticky" id="week-note"></div>
        <div class="panel" id="day-panel"></div>
        <div class="panel" id="month-totals"></div>
      </aside>
    </div>
  </section>

  <section id="tot-view" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="tot-head">
        <div><h2 class="hl">Totals by category</h2><div class="range num" id="range-label"></div></div>
        <div class="seg" role="group" aria-label="Range">
          <button data-range="week">Week</button>
          <button data-range="month" aria-pressed="true">Month</button>
          <button data-range="year">Year</button>
          <button data-range="all">All time</button>
        </div>
      </div>
      <div class="summary" id="summary"></div>
      <div class="table" id="table"></div>
    </div>
  </section>
</div>

<dialog id="entry-dlg">
  <form class="dlg" id="entry-form" method="dialog">
    <h3 id="entry-title">Log time</h3>
    <div class="fields">
      <div class="field full">
        <label for="f-cat">Category</label>
        <select id="f-cat" required></select>
      </div>
      <div class="field full" id="f-newcat-wrap" hidden>
        <label for="f-newcat">New category name</label>
        <input id="f-newcat" placeholder="e.g. Climbing">
      </div>
      <div class="field full">
        <label for="f-date">Date</label>
        <input type="date" id="f-date" required>
      </div>
      <div class="field">
        <label for="f-start">Start</label>
        <input type="time" id="f-start" required>
      </div>
      <div class="field">
        <label for="f-end">End</label>
        <input type="time" id="f-end" required>
      </div>
      <div class="field full" id="f-metric-wrap">
        <label for="f-metric" id="f-metric-label">Metric</label>
        <input type="number" id="f-metric" step="any" inputmode="decimal" placeholder="Leave blank if not tracked">
      </div>
      <div class="field full">
        <label for="f-note">Note</label>
        <textarea id="f-note" placeholder="Optional"></textarea>
      </div>
    </div>
    <div class="hint num" id="f-duration"></div>
    <div class="actions">
      <button type="button" class="btn ghost danger" id="f-delete">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="f-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="f-save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="cat-dlg">
  <div class="dlg">
    <h3>Categories</h3>
    <p class="hint" style="margin:0">Each category tracks time automatically. Add a custom metric, like points won or pages read, to log a number with every entry.</p>
    <div class="catrows" id="catrows"></div>
    <div class="actions">
      <button class="btn" id="add-cat">+ Add category</button>
      <span class="spacer"></span>
      <button class="btn primary" id="cats-done">Done</button>
    </div>
  </div>
</dialog>

<dialog id="confirm-dlg">
  <div class="dlg">
    <h3 id="confirm-title">Are you sure?</h3>
    <p class="hint" id="confirm-msg" style="margin:0"></p>
    <div class="actions">
      <span class="spacer"></span>
      <button class="btn" id="confirm-no">Cancel</button>
      <button class="btn primary" id="confirm-yes">Delete</button>
    </div>
  </div>
</dialog>

<script>
(function(){
const KEY = "hourbook.v1";
// Highlighter inks; chips draw them at partial strength over the paper.
const COLORS = ["#3474DB","#E8743B","#2FA36B","#9B59D0","#E5A800","#D9468C","#2BA3C4","#7A9A2E"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const durMin = e => { let d = toMin(e.end) - toMin(e.start); if (d < 0) d += 1440; return d; };
const fmtDur = m => { const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const fmtNum = n => (Math.round(n*100)/100).toLocaleString();
const fmtTime = t => { let [h,m] = t.split(":").map(Number); const ap = h>=12?"pm":"am"; h = h%12||12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    // Earlier builds saved generated example data flagged `example`; start those browsers fresh.
    if (s && !s.example) return s;
  } catch(e){}
  return {categories:[], entries:[]};
}
let syncer = null; // set by sync.js while someone is signed in
function save(){
  if (syncer) return syncer.push();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}

let state = load();
const today = ymd(new Date());
let view = "cal", range = "month";
let cursor = new Date(); cursor.setDate(1);
let selected = today;
const expanded = new Set();
const catById = id => state.categories.find(c => c.id === id);
const sortEntries = arr => arr.slice().sort((a,b) => a.date === b.date ? toMin(a.start)-toMin(b.start) : a.date < b.date ? -1 : 1);

/* ---------- Calendar ---------- */
function renderCalendar(){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  $("month-title").innerHTML = `<small>notes for ${y}</small><span class="hl">${MONTHS[m]}</span>`;
  const first = new Date(y, m, 1), start = new Date(y, m, 1-first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y, m+1, 0).getDate())/7);
  const byDate = {};
  state.entries.forEach(e => (byDate[e.date] ||= []).push(e));
  let html = "", monthMin = 0, monthCount = 0;
  for (let i = 0; i < weeks*7; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i), key = ymd(d);
    const list = sortEntries(byDate[key] || []);
    if (d.getMonth() === m){ list.forEach(e => { monthMin += durMin(e); monthCount++; }); }
    const cls = ["day", d.getMonth()!==m && "out", key===today && "today", key===selected && "sel"].filter(Boolean).join(" ");
    const chips = list.slice(0,3).map(e => { const c = catById(e.catId) || {name:"?",color:"#888"};
      return `<span class="chip" style="--c:${c.color}"><i></i><b>${esc(c.name)}</b><em>${fmtDur(durMin(e))}</em></span>`; }).join("");
    const more = list.length > 3 ? `<span class="more">+${list.length-3} more</span>` : "";
    html += `<button class="${cls}" data-date="${key}" aria-label="${MONTHS[d.getMonth()]} ${d.getDate()}, ${list.length} entries"><span class="dnum num">${d.getDate()}</span><span class="chips">${chips}</span>${more}</button>`;
  }
  $("days").innerHTML = html;
  $("month-meta").textContent = `${fmtDur(monthMin)} · ${monthCount} sessions`;
  renderMonthTotals();
}
function renderDay(){
  const d = parseYmd(selected);
  const list = sortEntries(state.entries.filter(e => e.date === selected));
  const total = list.reduce((s,e) => s+durMin(e), 0);
  const label = d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
  const items = list.length ? list.map(e => {
    const c = catById(e.catId) || {name:"?",color:"#888",metric:{}};
    const mv = c.metric?.label && e.value != null && e.value !== "" ? `<span>${fmtNum(e.value)} ${esc(c.metric.unit||c.metric.label)}</span>` : "";
    return `<button class="entry" data-entry="${e.id}" style="--c:${c.color}"><span class="bar"></span>
      <span><div class="t">${esc(c.name)}</div><div class="s num">${fmtTime(e.start)} – ${fmtTime(e.end)}${e.note ? " · "+esc(e.note) : ""}</div></span>
      <span class="v num"><strong>${fmtDur(durMin(e))}</strong>${mv}</span></button>`;
  }).join("") : `<div class="empty">Nothing logged on this day.</div>`;
  $("day-panel").innerHTML = `<h3>${esc(label)}</h3><div class="sub num">${list.length ? `${fmtDur(total)} across ${list.length} ${list.length===1?"session":"sessions"}` : "No time logged"}</div>
    <div class="elist">${items}</div><button class="btn primary" id="add-day">+ Log time on this day</button>`;
}

/* ---------- Totals ---------- */
function rangeBounds(){
  const n = new Date();
  if (range === "week"){ const s = new Date(n.getFullYear(), n.getMonth(), n.getDate()-n.getDay()); return [s, new Date(s.getFullYear(), s.getMonth(), s.getDate()+6)]; }
  if (range === "month") return [new Date(n.getFullYear(), n.getMonth(), 1), new Date(n.getFullYear(), n.getMonth()+1, 0)];
  if (range === "year") return [new Date(n.getFullYear(), 0, 1), new Date(n.getFullYear(), 11, 31)];
  return null;
}
function renderTotals(){
  document.querySelectorAll("[data-range]").forEach(b => b.setAttribute("aria-pressed", b.dataset.range === range));
  const b = rangeBounds();
  const opt = {month:"short", day:"numeric", year:"numeric"};
  $("range-label").textContent = b ? `${b[0].toLocaleDateString(undefined,opt)} – ${b[1].toLocaleDateString(undefined,opt)}` : "Every entry you've logged";
  const inRange = state.entries.filter(e => !b || (e.date >= ymd(b[0]) && e.date <= ymd(b[1])));
  const rows = state.categories.map(c => {
    const es = sortEntries(inRange.filter(e => e.catId === c.id)).reverse();
    const vals = es.filter(e => e.value != null && e.value !== "");
    return {c, es, min: es.reduce((s,e) => s+durMin(e), 0), metric: vals.reduce((s,e) => s+Number(e.value), 0), mcount: vals.length};
  }).sort((a,b) => b.min - a.min);
  const totalMin = rows.reduce((s,r) => s+r.min, 0), maxMin = Math.max(1, ...rows.map(r => r.min));
  const activeDays = new Set(inRange.map(e => e.date)).size;
  $("summary").innerHTML = `<div><span>Total time</span><strong>${fmtDur(totalMin)}</strong></div>
    <div><span>Sessions</span><strong>${inRange.length}</strong></div>
    <div><span>Active days</span><strong>${activeDays}</strong></div>`;
  if (!state.categories.length){ $("table").innerHTML = `<div class="empty">Add a category to start tracking.</div>`; return; }
  let html = `<div class="trow th"><div>Category</div><div>Sessions</div><div>Time</div><div>Custom metric</div><div></div></div>`;
  rows.forEach(({c, es, min, metric, mcount}) => {
    const open = expanded.has(c.id);
    const share = totalMin ? Math.round(min/totalMin*100) : 0;
    const metricCell = c.metric?.label
      ? `<span class="num">${fmtNum(metric)} ${esc(c.metric.unit||"")}</span><small>${esc(c.metric.label)}${mcount ? ` · avg ${fmtNum(metric/mcount)}` : ""}</small>`
      : `<small>No metric</small>`;
    html += `<button class="trow cat ${open?"open":""}" data-cat="${c.id}" style="--c:${c.color}" aria-expanded="${open}">
      <div class="cname"><i></i><span>${esc(c.name)}</span></div>
      <div class="sess num">${es.length}</div>
      <div class="timecell"><div class="track"><div class="fill" style="width:${min/maxMin*100}%"></div></div><span class="num" title="${share}% of total">${fmtDur(min)}</span></div>
      <div class="metric">${metricCell}</div>
      <div class="chev" aria-hidden="true">›</div></button>`;
    if (open){
      html += `<div class="detail">` + (es.length ? es.map(e => `<div class="drow">
        <span class="num">${parseYmd(e.date).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</span>
        <span class="num">${fmtDur(durMin(e))}</span>
        <span class="note">${esc(e.note) || `${fmtTime(e.start)} – ${fmtTime(e.end)}`}</span>
        ${c.metric?.label ? `<span class="metricedit"><input id="mv-${e.id}" type="number" step="any" data-mv="${e.id}" value="${e.value ?? ""}" aria-label="${esc(c.metric.label)}"><label for="mv-${e.id}">${esc(c.metric.unit||c.metric.label)}</label></span>` : "<span></span>"}
        <button class="btn ghost" data-entry="${e.id}">Edit</button></div>`).join("") : `<div class="hint" style="padding:8px 0">No entries in this range.</div>`) + `</div>`;
    }
  });
  $("table").innerHTML = html;
}

/* ---------- Side notes ---------- */
function weekRange(offset){
  const n = new Date(), s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - n.getDay() + offset*7);
  return {start: s, from: ymd(s), to: ymd(new Date(s.getFullYear(), s.getMonth(), s.getDate()+6))};
}
// Consecutive days with at least one entry, ending today (or yesterday, so an unlogged morning doesn't reset it).
function dayStreak(){
  const days = new Set(state.entries.map(e => e.date)), d = new Date();
  if (!days.has(ymd(d))) d.setDate(d.getDate()-1);
  let n = 0;
  while (days.has(ymd(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function renderWeekNote(){
  const wk = weekRange(0), prev = weekRange(-1);
  const inRange = r => state.entries.filter(e => e.date >= r.from && e.date <= r.to);
  const week = inRange(wk), weekMin = week.reduce((s,e) => s+durMin(e), 0);
  const prevMin = inRange(prev).reduce((s,e) => s+durMin(e), 0);
  let text;
  if (!state.categories.length) text = "Add a category, then log your first session. This note fills in as you go.";
  else if (!week.length) text = "Nothing logged yet this week. Your first session goes here.";
  else {
    const byCat = {};
    week.forEach(e => byCat[e.catId] = (byCat[e.catId] || 0) + durMin(e));
    const [topId, topMin] = Object.entries(byCat).sort((a,b) => b[1]-a[1])[0];
    const parts = [`${fmtDur(weekMin)} logged across ${week.length} ${week.length === 1 ? "session" : "sessions"}.`,
      `Most time on ${esc(catById(topId)?.name || "?")} (${fmtDur(topMin)}).`];
    if (prevMin && weekMin > prevMin) parts.push(`That's ${fmtDur(weekMin - prevMin)} more than last week!`);
    const streak = dayStreak();
    if (streak >= 2) parts.push(`${streak}-day streak going.`);
    text = parts.join(" ");
  }
  $("week-note").innerHTML = `<b>Week of ${wk.start.toLocaleDateString(undefined, {month:"short", day:"numeric"})}</b><p>${text}</p>`;
}
function renderMonthTotals(){
  const y = cursor.getFullYear(), m = cursor.getMonth(), prefix = `${y}-${pad(m+1)}-`;
  const now = new Date(), current = y === now.getFullYear() && m === now.getMonth();
  const inMonth = state.entries.filter(e => e.date.startsWith(prefix));
  const rows = state.categories.map(c => {
    const es = inMonth.filter(e => e.catId === c.id), vals = es.filter(e => e.value != null && e.value !== "");
    return {c, min: es.reduce((s,e) => s+durMin(e), 0), metric: vals.reduce((s,e) => s+Number(e.value), 0), hasMetric: vals.length > 0};
  }).filter(r => r.min > 0).sort((a,b) => b.min - a.min);
  const max = Math.max(1, ...rows.map(r => r.min));
  const title = current ? "This month" : `${MONTHS[m]} ${y}`;
  $("month-totals").innerHTML = `<h3>${title}</h3>` + (rows.length
    ? `<div class="mt-rows">${rows.map(r => `<div class="mt-row" style="--c:${r.c.color}">
        <span class="mt-dot"></span><span class="mt-name">${esc(r.c.name)}</span>
        <span class="mt-metric num">${r.c.metric?.label && r.hasMetric ? `${fmtNum(r.metric)} ${esc(r.c.metric.unit || r.c.metric.label)}` : ""}</span>
        <span class="mt-time">${fmtDur(r.min)}</span><span class="mt-bar"><i style="width:${r.min/max*100}%"></i></span></div>`).join("")}</div>`
    : `<div class="empty">No time logged in ${MONTHS[m]} yet.</div>`);
}

function render(){
  $("cal-view").hidden = view !== "cal";
  $("tot-view").hidden = view !== "tot";
  $("v-cal").setAttribute("aria-pressed", view === "cal");
  $("v-tot").setAttribute("aria-pressed", view === "tot");
  if (view === "cal"){ renderCalendar(); renderDay(); renderWeekNote(); } else renderTotals();
}

/* ---------- Entry dialog ---------- */
let editing = null;
function fillCatSelect(sel){
  $("f-cat").innerHTML = state.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("") + `<option value="__new">+ New category…</option>`;
  if (sel) $("f-cat").value = sel;
}
function syncMetricField(){
  const c = catById($("f-cat").value);
  const has = c && c.metric?.label;
  $("f-metric-wrap").hidden = !has;
  if (has) $("f-metric-label").textContent = `${c.metric.label}${c.metric.unit ? ` (${c.metric.unit})` : ""}`;
}
function syncDuration(){
  const s = $("f-start").value, e = $("f-end").value;
  $("f-duration").textContent = s && e ? `Duration: ${fmtDur(durMin({start:s,end:e}))}` : "";
}
function openEntry(entry, date){
  if (!state.categories.length){ openCats(); return; }
  editing = entry || null;
  $("entry-title").textContent = entry ? "Edit entry" : "Log time";
  fillCatSelect(entry ? entry.catId : (openEntry.lastCat && catById(openEntry.lastCat) ? openEntry.lastCat : state.categories[0].id));
  $("f-date").value = entry ? entry.date : (date || selected);
  $("f-start").value = entry ? entry.start : "18:00";
  $("f-end").value = entry ? entry.end : "19:00";
  $("f-metric").value = entry && entry.value != null ? entry.value : "";
  $("f-note").value = entry ? entry.note : "";
  $("f-delete").hidden = !entry;
  $("f-newcat").value = ""; $("f-newcat").required = false; $("f-newcat-wrap").hidden = true;
  syncMetricField(); syncDuration();
  $("entry-dlg").showModal();
}
// In-page replacement for confirm(): sandboxed iframes silently block native modals.
function askConfirm(title, message, yesLabel = "Delete"){
  return new Promise(resolve => {
    const dlg = $("confirm-dlg");
    $("confirm-title").textContent = title;
    $("confirm-msg").textContent = message;
    $("confirm-yes").textContent = yesLabel;
    const finish = ok => { dlg.close(); $("confirm-yes").onclick = $("confirm-no").onclick = dlg.oncancel = null; resolve(ok); };
    $("confirm-yes").onclick = () => finish(true);
    $("confirm-no").onclick = () => finish(false);
    dlg.oncancel = ev => { ev.preventDefault(); finish(false); };
    dlg.showModal();
  });
}
$("f-cat").addEventListener("change", () => {
  const isNew = $("f-cat").value === "__new";
  $("f-newcat-wrap").hidden = !isNew;
  $("f-newcat").required = isNew;
  if (isNew) $("f-newcat").focus();
  syncMetricField();
});
$("f-start").addEventListener("input", syncDuration);
$("f-end").addEventListener("input", syncDuration);
$("f-cancel").addEventListener("click", () => $("entry-dlg").close());
$("entry-form").addEventListener("submit", ev => {
  ev.preventDefault();
  let catId = $("f-cat").value;
  if (catId === "__new"){
    const name = $("f-newcat").value.trim(); if (!name) return;
    const c = {id:uid(), name, color:COLORS[state.categories.length % COLORS.length], metric:{label:"", unit:""}, created:Date.now()};
    state.categories.push(c); catId = c.id;
  }
  if (!catById(catId)) return;
  const raw = $("f-metric").value;
  const data = {catId, date:$("f-date").value, start:$("f-start").value, end:$("f-end").value,
    value: raw === "" || $("f-metric-wrap").hidden ? null : Number(raw), note:$("f-note").value.trim()};
  // Look the entry up by id: a sync may have swapped in fresh objects while the dialog was open.
  const target = editing && state.entries.find(e => e.id === editing.id);
  if (target) Object.assign(target, data); else state.entries.push({id:uid(), ...data});
  openEntry.lastCat = catId;
  selected = data.date;
  const d = parseYmd(data.date); if (view === "cal" && (d.getMonth() !== cursor.getMonth() || d.getFullYear() !== cursor.getFullYear())) cursor = new Date(d.getFullYear(), d.getMonth(), 1);
  save(); $("entry-dlg").close(); render();
});
$("f-delete").addEventListener("click", async () => {
  if (!editing || !await askConfirm("Delete this entry?", "This removes it from the calendar and your totals.")) return;
  state.entries = state.entries.filter(e => e.id !== editing.id);
  save(); $("entry-dlg").close(); render();
});

/* ---------- Categories dialog ---------- */
function renderCats(){
  $("catrows").innerHTML = state.categories.map(c => `<div class="catrow" style="--c:${c.color}" data-cid="${c.id}">
    <span class="dot"></span><input id="cn-${c.id}" data-k="name" value="${esc(c.name)}" aria-label="Category name">
    <div class="swatches">${COLORS.map(col => `<button class="sw" style="--c:${col}" data-color="${col}" aria-label="Color ${col}" aria-pressed="${col===c.color}"></button>`).join("")}</div>
    <div class="mrow"><input id="ml-${c.id}" data-k="label" value="${esc(c.metric?.label)}" placeholder="Custom metric, e.g. Points won" aria-label="Metric name">
      <input id="mu-${c.id}" data-k="unit" value="${esc(c.metric?.unit)}" placeholder="Unit" aria-label="Metric unit">
      <button class="btn ghost danger" data-delcat="${c.id}">Delete</button></div></div>`).join("")
    || `<div class="empty">No categories yet.</div>`;
}
function openCats(){ renderCats(); $("cat-dlg").showModal(); }
$("catrows").addEventListener("input", ev => {
  const row = ev.target.closest("[data-cid]"); if (!row) return;
  const c = catById(row.dataset.cid), k = ev.target.dataset.k;
  if (k === "name") c.name = ev.target.value;
  else { c.metric ||= {label:"",unit:""}; c.metric[k] = ev.target.value; }
  save();
});
$("catrows").addEventListener("click", async ev => {
  const sw = ev.target.closest("[data-color]"), del = ev.target.closest("[data-delcat]");
  if (sw){ const row = sw.closest("[data-cid]"); catById(row.dataset.cid).color = sw.dataset.color; save(); renderCats(); }
  if (del){
    const id = del.dataset.delcat, n = state.entries.filter(e => e.catId === id).length;
    const name = catById(id)?.name || "this category";
    if (!await askConfirm(`Delete ${name}?`, n ? `Its ${n} ${n===1?"entry":"entries"} will be deleted too.` : "It has no entries.")) return;
    state.categories = state.categories.filter(c => c.id !== id);
    state.entries = state.entries.filter(e => e.catId !== id);
    save(); renderCats();
  }
});
$("add-cat").addEventListener("click", () => {
  const c = {id:uid(), name:"New category", color:COLORS[state.categories.length % COLORS.length], metric:{label:"", unit:""}, created:Date.now()};
  state.categories.push(c); save(); renderCats();
  const inp = $("cn-"+c.id); inp.focus(); inp.select();
});
$("cats-done").addEventListener("click", () => $("cat-dlg").close());
$("cat-dlg").addEventListener("close", render);

/* ---------- Wiring ---------- */
$("v-cal").addEventListener("click", () => { view = "cal"; render(); });
$("v-tot").addEventListener("click", () => { view = "tot"; render(); });
$("open-cats").addEventListener("click", openCats);
$("log-btn").addEventListener("click", () => openEntry(null));
$("prev-m").addEventListener("click", () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1); renderCalendar(); });
$("next-m").addEventListener("click", () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1); renderCalendar(); });
$("today-btn").addEventListener("click", () => { cursor = new Date(); cursor.setDate(1); selected = today; render(); });
$("days").addEventListener("click", ev => { const d = ev.target.closest("[data-date]"); if (!d) return; selected = d.dataset.date; renderCalendar(); renderDay(); });
$("days").addEventListener("dblclick", ev => { const d = ev.target.closest("[data-date]"); if (d) openEntry(null, d.dataset.date); });
$("day-panel").addEventListener("click", ev => {
  if (ev.target.closest("#add-day")) return openEntry(null, selected);
  const e = ev.target.closest("[data-entry]"); if (e) openEntry(state.entries.find(x => x.id === e.dataset.entry));
});
document.querySelectorAll("[data-range]").forEach(b => b.addEventListener("click", () => { range = b.dataset.range; renderTotals(); }));
$("table").addEventListener("click", ev => {
  const ed = ev.target.closest("[data-entry]");
  if (ed) return openEntry(state.entries.find(x => x.id === ed.dataset.entry));
  const row = ev.target.closest("[data-cat]"); if (!row) return;
  const id = row.dataset.cat; expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderTotals();
});
$("table").addEventListener("change", ev => {
  const id = ev.target.dataset?.mv; if (!id) return;
  const e = state.entries.find(x => x.id === id); if (!e) return;
  e.value = ev.target.value === "" ? null : Number(ev.target.value);
  save(); renderTotals();
});

function refresh(){
  render();
  if ($("cat-dlg").open && !$("catrows").contains(document.activeElement)) renderCats();
}
// Bridge for sync.js: while signed in, the account's synced log replaces this browser's local one.
window.Hourbook = {
  get state(){ return state; },
  loadLocal: load,
  clearLocal(){ try { localStorage.removeItem(KEY); } catch(e){} },
  attach(s, next){ syncer = s; state = next; refresh(); },
  detach(){ syncer = null; state = load(); refresh(); },
  refresh,
};

render();
})();
</script>
<script type="module" src="sync.js"></script>
